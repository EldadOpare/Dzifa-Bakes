<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Dzifa Bakes</title>
    <meta name="description" content="Guided custom cake quotes, invoices, and bakery operations for Dzifa Bakes." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Dzifa Bakes" />
    <meta property="og:description" content="Guided custom cake quotes, invoices, and bakery operations for Dzifa Bakes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dzifa Bakes" />
    <meta name="twitter:description" content="Guided custom cake quotes, invoices, and bakery operations for Dzifa Bakes." />
    <meta name="twitter:image" content="/logo.jpg" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      /* This ran before the app's own CSS loaded, so the loader could not use Tailwind classes or fonts yet. */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FFFFFF;
        transition: opacity .5s ease, visibility .5s ease;
      }
      #app-loader.app-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-loader__mark {
        width: 96px;
        height: 96px;
        border-radius: 999px;
        object-fit: cover;
        animation: app-loader-in .7s cubic-bezier(.2, .9, .3, 1.2) both,
          app-loader-breathe 3s ease-in-out .7s infinite;
      }
      .app-loader__bar {
        width: 130px;
        height: 2px;
        background: rgba(60, 62, 66, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }
      .app-loader__bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #366862;
        border-radius: 999px;
        animation: app-loader-sweep 1.3s ease-in-out infinite;
      }
      @keyframes app-loader-in {
        from { opacity: 0; transform: scale(.85); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes app-loader-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes app-loader-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(340%); }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-hidden="true">
      <img class="app-loader__mark" src="/logo.jpg" alt="" />
      <div class="app-loader__bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
