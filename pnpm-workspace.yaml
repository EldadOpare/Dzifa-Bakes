# This made pnpm wait one day after a package version was published before it
# could be installed. Most bad npm releases were caught and pulled within
# hours, so this delay gave real protection against a supply chain attack.
# This setting was meant to stay on. A trusted package could be added to
# minimumReleaseAgeExclude below if it needed to install sooner.
minimumReleaseAge: 1440

packages:
  - api
  - web
  - lib/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # This override was needed because drizzle-kit used an older, unsafe version of esbuild inside it.
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
